<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1122"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="950" cy="180" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="200" cy="500" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="100" y1="180" x2="700" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowTopRight)"/>
  <rect width="1200" height="630" fill="url(#glowBottomLeft)"/>

  <!-- Outer Cyber Border -->
  <rect x="28" y="28" width="1144" height="574" rx="24" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>

  <!-- Top Academic Pill Badge -->
  <g transform="translate(90, 85)">
    <rect width="320" height="38" rx="19" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.5"/>
    <text x="160" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">🎓 BUILT FOR SRM STUDENTS</text>
  </g>

  <!-- Live Status Dot -->
  <g transform="translate(430, 93)">
    <circle cx="10" cy="11" r="5" fill="#22c55e"/>
    <text x="24" y="16" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PRODUCTION LIVE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="90" y="215" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">⚡ SRM Note Finder</text>

  <!-- Primary Subtitle -->
  <text x="90" y="278" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Your Semester. Your Resources. One Smart Platform.</text>

  <!-- Description -->
  <text x="90" y="328" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">150+ Curated Notes, Verified PYQs, 75% Attendance Predictor &amp; Real-Time Community</text>

  <!-- 5 Feature Badges Row -->
  <g transform="translate(90, 395)">
    <!-- Pill 1: Academic Hub -->
    <g transform="translate(0, 0)">
      <rect width="195" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
      <text x="97" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📚 150+ Unit Notes</text>
    </g>

    <!-- Pill 2: PYQ Question Papers -->
    <g transform="translate(208, 0)">
      <rect width="195" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
      <text x="97" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📝 Verified PYQs</text>
    </g>

    <!-- Pill 3: Grade Engine -->
    <g transform="translate(416, 0)">
      <rect width="195" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
      <text x="97" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧮 SGPA &amp; CGPA</text>
    </g>

    <!-- Pill 4: Attendance Planner -->
    <g transform="translate(624, 0)">
      <rect width="200" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(234,179,8,0.3)" stroke-width="1.5"/>
      <text x="100" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 75% Bunk Planner</text>
    </g>

    <!-- Pill 5: Community Lounge -->
    <g transform="translate(836, 0)">
      <rect width="185" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(244,63,94,0.3)" stroke-width="1.5"/>
      <text x="92" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">💬 Student Lounge</text>
    </g>
  </g>

  <!-- Footer Platform URL & Stats -->
  <g transform="translate(90, 520)">
    <text x="0" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🌐 srmnotefinder.vercel.app</text>
    <text x="830" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">React 18 • Node.js • MongoDB • Socket.IO</text>
  </g>
</svg>
